name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, docs/sentinel-documentation-baseline, feat/python-plugin-runtime-foundation]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python plugin foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend and development dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Check formatting
        run: ruff format --check src plugins tests

      - name: Lint
        run: ruff check src plugins

      - name: Type-check
        run: mypy src plugins/rsi-macd-candidate/plugin.py

      - name: Test
        run: pytest -q
